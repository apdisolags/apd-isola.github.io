 <!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d14">
    <meta name="description" content="A.P.D. Isola Polisportiva Gran Sasso: pallavolo, basket, fitness e podismo.">
    <title>A.P.D. Isola · Polisportiva Gran Sasso</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sport: {
                            dark: '#0a0d14',
                            card: '#121722',
                            cardHover: '#1a2233',
                            blue: '#0284c7',
                            cyan: '#38bdf8',
                            accent: '#f43f5e',
                            success: '#10b981',
                            muted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Outfit', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #0a0d14;
        }

        body {
            min-width: 100%;
        }

        main,
        section,
        footer {
            width: 100%;
        }

        .full-bleed {
            width: 100%;
        }

        .hero-section {
            isolation: isolate;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(90deg, rgba(10, 13, 20, .90), rgba(10, 13, 20, .72) 52%, rgba(10, 13, 20, .90)),
                url('hero.png') center / cover no-repeat;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 45%, transparent 7%, rgba(10, 13, 20, .12) 43%, rgba(10, 13, 20, .65) 100%),
                linear-gradient(180deg, rgba(10, 13, 20, .12), rgba(10, 13, 20, .36));
        }

        .hero-section::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(10, 13, 20, .18), transparent 46%, rgba(10, 13, 20, .38));
        }

        /* Logo istituzionale visibile dietro al contenuto Hero. */
        .hero-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(620px, 62vw);
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            background: url('logo-apd-isola.png') center / contain no-repeat;
            opacity: .21;
            filter: grayscale(1) brightness(1.85) contrast(.92);
            mix-blend-mode: screen;
            animation: watermarkPulse 8s ease-in-out infinite;
        }

        .hero-watermark::after {
            content: '';
            position: absolute;
            inset: 8%;
            z-index: -1;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, .20), rgba(2, 132, 199, .08) 42%, transparent 72%);
            filter: blur(18px);
        }

        @keyframes watermarkPulse {
            0%, 100% {
                opacity: .17;
                transform: translate(-50%, -50%) scale(.985);
            }
            50% {
                opacity: .25;
                transform: translate(-50%, -50%) scale(1.02);
            }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.03); }
        }

        .animate-float {
            animation: floatSlow 6s ease-in-out infinite;
        }

        .glass-header {
            background: rgba(10, 13, 20, .86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .glass-card {
            background: rgba(18, 23, 34, .72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .08);
            transition: border-color .3s ease, box-shadow .3s ease, transform .3s ease;
        }

        .glass-card:hover {
            border-color: rgba(56, 189, 248, .40);
            box-shadow: 0 20px 40px -15px rgba(2, 132, 199, .20);
        }

        #paga-quota .quota-card {
            min-height: 360px;
            padding: 2rem;
        }

        #paga-quota .quota-card h3 {
            font-size: 1.7rem;
        }

        #paga-quota .kit-card {
            margin-top: 2.5rem;
            padding: 1.5rem 2rem;
            border-radius: 1.5rem;
            background: linear-gradient(135deg, rgba(2, 132, 199, .16), rgba(56, 189, 248, .08));
            border: 1px solid rgba(56, 189, 248, .35);
            box-shadow: 0 18px 45px -25px rgba(2, 132, 199, .45);
        }

        #paga-quota .kit-card .kit-title {
            font-size: 1.1rem;
        }

        #paga-quota .kit-card .kit-price {
            font-size: 1.75rem;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (max-width: 1023px) {
            .hero-watermark {
                width: min(560px, 78vw);
                opacity: .19;
            }
        }

        @media (max-width: 640px) {
            .hero-watermark {
                width: 390px;
                max-width: 92vw;
                top: 43%;
                opacity: .16;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body class="bg-sport-dark text-slate-100 font-sans antialiased selection:bg-sport-blue selection:text-white">

        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-sport-accent/10 rounded-full blur-[140px] animate-float" style="animation-delay: -3s"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-sport-cyan/10 rounded-full blur-[130px] animate-float" style="animation-delay: -1.5s"></div>

                    <div class="w-full h-full bg-sport-dark rounded-[10px] flex items-center justify-center font-bold text-sport-cyan text-lg font-display">IS</div>
                </div>
                <div>

                    <span class="relative px-5 py-2.5 bg-sport-dark rounded-[11px] flex items-center gap-2 text-sm font-bold text-white transition-colors duration-300 group-hover:bg-transparent">
